version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/documentation"
      - "/examples/**/*"
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directories:
      - /
      - /cmd/**/*
      - /examples/**/*
      - /extra/**/*
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"

  - package-ecosystem: github-actions
    directory: /
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    
